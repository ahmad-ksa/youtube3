name: capture
# Studies YouTube's TV app data (side menu, pages) on pushes to ci/* branches; never releases anything.
on:
  push:
    branches: ['ci/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
      - run: pnpm run build
      - run: npm i --no-save playwright@1.48.2 && npx playwright install chrome
      - run: node ci/capture.cjs
        env: { CHANNEL: chrome }
      - name: publish results to branch capture-results
        if: always()
        run: |
          mkdir -p /tmp/res && cp -r capture/* /tmp/res/ 2>/dev/null || true
          echo "${{ github.sha }}" > /tmp/res/commit.txt
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git checkout --orphan capture-results && git rm -rqf . && cp -r /tmp/res/* . && git add -A && git commit -qm "capture ${{ github.run_id }}" && git push -f origin capture-results
