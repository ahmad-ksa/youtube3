name: capture
# Studies YouTube's TV app data (side menu, pages) on pushes to ci/* branches; never releases anything.
on:
  push:
    branches: ['ci/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
      - run: pnpm run build
      - name: playwright (own folder, so npm does not touch pnpm's node_modules)
        run: mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.48.2 && npx playwright install chrome
      - run: mkdir -p capture && node ci/capture.cjs 2>&1 | tee capture/run.log
        env: { CHANNEL: chrome, NODE_PATH: /tmp/pw/node_modules }
      - name: publish results to branch capture-results
        if: always()
        run: |
          mkdir -p /tmp/res && cp -r capture/* /tmp/res/ 2>/dev/null || true
          echo "${{ github.sha }}" > /tmp/res/commit.txt
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git checkout --orphan capture-results && git rm -rqf . && git clean -fdxq && cp -r /tmp/res/* . && git add -A && git commit -qm "capture ${{ github.run_id }}" && git push -f origin capture-results
